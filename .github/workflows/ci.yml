name: CI + Deploy

on:
    push:
        branches: ['main']
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:

env:
    HUSKY: 0

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # -------------------------
    # 1. CHECK (types, format, lint)
    # -------------------------
    check:
        name: Check (lint + types)
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile
            - run: pnpm run ci:check

    # -------------------------
    # 2. UNIT TESTS (after check)
    # -------------------------
    unit-test:
        name: Unit Tests
        runs-on: ubuntu-latest
        needs: check
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile
            - run: pnpm run ci:test:unit

    # -------------------------
    # 3. E2E TESTS (after unit)
    # -------------------------
    e2e:
        name: Playwright E2E
        runs-on: ubuntu-latest
        needs: unit-test
        timeout-minutes: 60
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps

            - name: Run E2E tests
              run: pnpm run ci:test:e2e

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: tests/e2e/playwright/report/
                  retention-days: 30

    # -------------------------
    # 4. DEPLOY (after ALL pass)
    # -------------------------
    deploy:
        name: Deploy to GitHub Pages
        runs-on: ubuntu-latest
        needs: e2e
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: pages
            cancel-in-progress: true
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile
            - run: pnpm build

            - uses: actions/configure-pages@v6

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: ./dist

            - id: deployment
              uses: actions/deploy-pages@v5
